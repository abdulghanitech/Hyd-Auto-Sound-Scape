<body>

<div class="hero-bg" aria-hidden="true">
  <video class="hero-video" playsinline muted loop disablepictureinpicture preload="none" poster="/bg.jpg"></video>
  <div class="scrim"></div>
</div>

<main>
  <div class="clock" id="clock" aria-hidden="true">
    <span id="clock-h">12</span><span class="colon">:</span><span id="clock-m">00</span><span class="meridiem" id="clock-ap">pm</span>
  </div>

  <div class="links">
    <a class="pill" id="yt-link" href="https://www.youtube.com/watch?v=DmmonjioJsI" target="_blank" rel="noopener noreferrer" aria-label="Open on YouTube">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/></svg>
      <span class="pill-label">YouTube</span>
      <span class="pill-arrow" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>
  </div>

  <header class="brand" id="brand">
    <p class="brand-mark">HYD AUTO</p>
    <p class="brand-line">Gaane that only slap in a Hyderabad auto.</p>
  </header>

  <section class="player" id="player-card" aria-label="Now playing">
    <div class="disc" id="disc">
      <img id="cover" src="/covers/disc/DmmonjioJsI.jpg" alt="" width="640" height="640">
      <span class="disc-sheen" aria-hidden="true"></span>
      <span class="disc-hole" aria-hidden="true"></span>
    </div>

    <div class="meta">
      <div class="title" id="track-title">Hyderabadi Marfa</div>
      <div class="artist" id="track-artist">DJ Nikhil Martyn</div>
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <div class="time"><span id="elapsed">0:00</span> / <span id="duration">0:00</span></div>
    </div>

    <div class="controls">
      <button class="ctl" id="prev" type="button" aria-label="Previous track">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14l-11-7z"/></svg>
      </button>
      <button class="ctl play" id="play" type="button" aria-label="Play">
        <svg class="i-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        <svg class="i-pause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
      <button class="ctl" id="next" type="button" aria-label="Next track">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
      </button>
    </div>
  </section>

  <div class="yt-host" aria-hidden="true">
    <iframe
      id="yt-player"
      title="Audio player"
      allow="autoplay; encrypted-media; picture-in-picture 'none'"
      frameborder="0"
      tabindex="-1"></iframe>
  </div>
</main>

<script src="/tracks.js"></script>
<script src="/app.js" defer></script>
<script src="/hero-video.js" defer></script>
<script src="/noise.js" defer></script>
</body>
</html>
