<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HYD AUTO — Drive a Hyderabad auto</title>
<meta name="description" content="Drive a yellow auto through Charminar and Tank Bund. Pick up passengers, run the meter, and blast gaane that only slap in a Hyderabad auto.">
<meta name="theme-color" content="#12100E">

<meta property="og:title" content="HYD AUTO">
<meta property="og:description" content="Drive a yellow auto through Hyderabad. Gaane that only slap in a yellow meter.">
<meta property="og:site_name" content="HYD AUTO">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_IN">
<meta property="og:url" content="https://hyd-auto.vercel.app">
<meta property="og:image" content="https://hyd-auto.vercel.app/bg.jpg">
<meta property="og:image:width" content="1600">
<meta property="og:image:height" content="900">
<meta property="og:image:alt" content="POV from a yellow Hyderabad auto looking toward Charminar at dusk.">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="HYD AUTO">
<meta name="twitter:description" content="Drive a yellow auto through Hyderabad. Gaane that only slap in a yellow meter.">
<meta name="twitter:image" content="https://hyd-auto.vercel.app/bg.jpg">

<link rel="canonical" href="https://hyd-auto.vercel.app">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">

<!-- The loading backdrop is the old site's hero. It paints before any JS parses,
     so there is zero perceived regression versus the static version. -->
<link rel="preload" as="image" href="/bg.jpg" fetchpriority="high">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<!-- Setlist. Plain script, served verbatim from public/ — edit this one file to
     change what plays. Loaded before the module entry so window.TRACKS exists. -->
<script src="/tracks.js"></script>
</head>
<body>

<canvas id="stage"></canvas>

<!-- ---------- loading / title ---------- -->
<div class="boot" id="boot">
  <div class="boot-bg" aria-hidden="true"></div>
  <div class="boot-scrim" aria-hidden="true"></div>

  <div class="boot-inner">
    <h1 class="brand-mark">HYD AUTO</h1>
    <p class="brand-line">Gaane that only slap in a Hyderabad auto.</p>

    <div class="boot-progress" id="boot-progress" role="progressbar" aria-label="Loading">
      <span class="boot-bar" id="boot-bar"></span>
    </div>
    <p class="boot-status" id="boot-status">Warming up the engine…</p>

    <button class="start-btn" id="start-btn" type="button" hidden>
      CHALO
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <p class="start-hint" id="start-hint" hidden>Best with sound on 🔊</p>
  </div>
</div>

<!-- ---------- in-game HUD (populated by src/ui) ---------- -->
<div class="hud" id="hud" hidden></div>

<!-- Audio. A 1×1 transparent iframe — picture-in-picture is denied by
     vercel.json so playback can never escape the page. -->
<div class="yt-host" aria-hidden="true">
  <iframe
    id="yt-player"
    title="Audio player"
    allow="autoplay; encrypted-media"
    frameborder="0"
    tabindex="-1"></iframe>
</div>

<noscript>
  <div class="noscript">HYD AUTO needs JavaScript and WebGL to run the ride.</div>
</noscript>

<script type="module" src="/src/main.js"></script>
</body>
</html>
